name: Windows synthetic checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install synthetic test dependencies
        run: |
          python -m pip install -r requirements.txt playwright==1.47.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $browser = python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "REVIEW_BROWSER_BINARY=$browser" >> $env:GITHUB_ENV
      - name: Run required CLI, Workspace and browser checks
        run: ./scripts/check.ps1 -Python python
